[project]
name = "ha-sales-forecast"
version = "0.1.0"
description = "Independent Hanna Andersson KYDC sales forecast and slotting forecast research tooling."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.1",
    "numpy>=2.0",
    "pyarrow>=23.0.1",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.0.49",
    "python-calamine>=0.6.2",
    "xlsxwriter>=3.2.0",
    "scikit-learn>=1.9.0",
    "lightgbm>=4.6.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]
